name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-erlang:
    # `just all` runs `gleam format --check`, and formatter output differs between
    # compiler versions, so the release gate uses the latest 1.x on every OTP it covers.
    name: Test (Erlang, OTP ${{ matrix.otp-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp-version: ["27", "28", "29"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp-version }}
          gleam-version: "1.x"
      - run: just all

  test-javascript:
    name: Test (JavaScript, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "lts/*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: gleam deps download
      - run: gleam test --target javascript

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [test-erlang, test-javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - run: echo 'I am not using semantic versioning' | gleam publish -y
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
